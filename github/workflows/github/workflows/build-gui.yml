name: Build Complete PS1 Converter Tool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout GUI Repository
        uses: actions/checkout@v4

      - name: Checkout psxrecomp Repository
        uses: actions/checkout@v4
        with:
          repository: RetroPortingToolKit/psxrecomp
          submodules: recursive
          path: psxrecomp_source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build GUI EXE with PyInstaller
        run: pyinstaller --noconsole --onefile app.py

      - name: Upload Complete Package
        uses: actions/upload-artifact@v4
        with:
          name: PS1-Converter-Complete
          path: dist/*.exe
